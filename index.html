<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>VoiceMind AI - Smart Voice Notes</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        urdu: ['Noto Nastaliq Urdu', 'serif']
                    },
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            accent: '#06b6d4'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .urdu-text { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.2; direction: rtl; text-align: right; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-effect { box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body id="app-body" class="bg-slate-950 text-slate-100 font-sans h-full overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="px-5 py-4 bg-slate-900/90 border-b border-slate-800/80 flex justify-between items-center z-20">
        <div class="flex items-center gap-3">
            <!-- Settings Dropdown Menu Button -->
            <div class="relative">
                <button onclick="toggleSettingsMenu()" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center text-white shadow-lg glow-effect focus:outline-none">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
                <!-- Settings Popover Menu -->
                <div id="settings-menu" class="hidden absolute left-0 mt-2 w-56 glass-card rounded-2xl p-3 shadow-2xl z-50 space-y-3 border border-slate-700">
                    <div class="text-xs font-bold text-indigo-400 uppercase tracking-wider px-1">App Settings</div>
                    
                    <!-- Theme Selector -->
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Theme Style</label>
                        <select id="setting-theme" onchange="changeTheme(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none">
                            <option value="slate">🌌 Dark Slate (Default)</option>
                            <option value="midnight">🌙 Midnight Blue</option>
                            <option value="emerald">🌲 Emerald Forest</option>
                            <option value="sunset">🌅 Sunset Purple</option>
                            <option value="cyberpunk">⚡ Cyberpunk Neon</option>
                        </select>
                    </div>

                    <!-- Voice Spectrum Style -->
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Voice Visualizer</label>
                        <select id="setting-spectrum" onchange="changeSpectrumStyle(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none">
                            <option value="bar">Bars Waveform</option>
                            <option value="wave">Pulse Wave</option>
                        </select>
                    </div>

                    <!-- Add Custom Category -->
                    <div class="pt-1 border-t border-slate-800">
                        <label class="block text-[11px] text-slate-400 mb-1">Add New Category</label>
                        <div class="flex gap-1.5">
                            <input type="text" id="new-category-input" placeholder="Category name..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-2 py-1 text-xs text-slate-200 focus:outline-none">
                            <button onclick="addNewCategory()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded-xl text-xs"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <h1 class="font-bold text-lg leading-none bg-gradient-to-r from-indigo-300 via-cyan-300 to-white bg-clip-text text-transparent">VoiceMind AI</h1>
                <p class="text-[11px] text-slate-400 mt-1">Live Recorder</p>
            </div>
        </div>

        <!-- Language Selector -->
        <div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl p-1">
            <button onclick="setLanguage('ur')" id="lang-ur-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition-all">اردو</button>
            <button onclick="setLanguage('en')" id="lang-en-btn" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 transition-all">English</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4 relative pb-24">
        
        <!-- Tab 1: Live Recording View -->
        <div id="tab-record" class="space-y-4">
            
            <!-- Category & Status Bar -->
            <div class="flex justify-between items-center px-1">
                <select id="note-category" class="bg-slate-900/90 border border-slate-800 text-slate-300 text-xs rounded-xl px-3 py-1.5 focus:outline-none">
                    <option value="General">🏷️ General</option>
                    <option value="Work">💼 Work</option>
                    <option value="Ideas">💡 Ideas</option>
                    <option value="Personal">📝 Personal</option>
                </select>
                <div id="recording-timer" class="text-xs font-mono text-slate-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-slate-600" id="timer-dot"></span> 00:00
                </div>
            </div>

            <!-- Voice Visualizer Box -->
            <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center h-28 relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/5 via-cyan-500/5 to-transparent pointer-events-none"></div>
                <div id="visualizer-container" class="flex items-center gap-1 h-12 w-full justify-center">
                    <div class="w-1 bg-indigo-500/30 h-4 rounded-full animate-pulse"></div>
                    <div class="w-1 bg-indigo-500/50 h-8 rounded-full animate-pulse"></div>
                    <div class="w-1 bg-cyan-400 h-12 rounded-full animate-pulse"></div>
                    <div class="w-1 bg-indigo-500/50 h-8 rounded-full animate-pulse"></div>
                    <div class="w-1 bg-indigo-500/30 h-4 rounded-full animate-pulse"></div>
                </div>
                <p id="visualizer-status" class="text-[11px] text-slate-400 mt-2 font-medium">Tap microphone to begin listening</p>
            </div>

            <!-- Transcript Cards -->
            <div class="grid grid-cols-1 gap-3">
                <!-- Original Spoken Text -->
                <div class="glass-card rounded-2xl p-4 space-y-2">
                    <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-2">
                        <span class="font-semibold text-indigo-400 flex items-center gap-1.5"><i class="fa-solid fa-microphone"></i> Live Transcript</span>
                        <button onclick="copyText('transcript-box')" class="hover:text-white transition-colors"><i class="fa-regular fa-copy"></i></button>
                    </div>
                    <div id="transcript-box" class="min-h-[70px] max-h-36 overflow-y-auto text-sm text-slate-200 outline-none whitespace-pre-wrap urdu-text" contenteditable="true" placeholder="Speech transcript will appear here..."></div>
                </div>

                <!-- Translated Text -->
                <div class="glass-card rounded-2xl p-4 space-y-2">
                    <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-2">
                        <span class="font-semibold text-cyan-400 flex items-center gap-1.5"><i class="fa-solid fa-language"></i> Translation</span>
                        <button onclick="copyText('translation-box')" class="hover:text-white transition-colors"><i class="fa-regular fa-copy"></i></button>
                    </div>
                    <div id="translation-box" class="min-h-[70px] max-h-36 overflow-y-auto text-sm text-slate-200 outline-none whitespace-pre-wrap" contenteditable="true" placeholder="Simultaneous translation will appear here..."></div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3 pt-2
